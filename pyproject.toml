[project]
name = "mintsearch"
version = "0.1.0"
description = "Search, a sitemap and llms.txt for a self-hosted Mintlify export."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashfall", email = "contact@fray.lol" }]
keywords = ["mintlify", "docs", "search", "static-site", "sitemap", "llms.txt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ashfall-sh/mintsearch"
Issues = "https://github.com/ashfall-sh/mintsearch/issues"

[project.scripts]
mintsearch = "mintsearch.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mintsearch = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
